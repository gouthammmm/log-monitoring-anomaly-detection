name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [producer, ingestion-consumer, detection-service, ai-summary-service, api-gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        working-directory: ${{ matrix.service }}
        run: ruff check src

      - name: Build Docker image
        run: docker build -t log-anomaly/${{ matrix.service }}:ci -f ${{ matrix.service }}/Dockerfile ${{ matrix.service == 'api-gateway' && '.' || matrix.service }}

  compose-smoke-test:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4
      - name: Build all images via docker compose
        run: docker compose build
      - name: Bring the stack up and check health
        run: |
          docker compose up -d kafka clickhouse
          sleep 20
          docker compose ps
      - name: Tear down
        if: always()
        run: docker compose down -v
